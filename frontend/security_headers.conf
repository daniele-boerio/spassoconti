# Header di sicurezza, inclusi da nginx.conf.
#
# Vanno inclusi nel blocco `server` E in ogni `location` che ha un suo add_header:
# in nginx una location con anche un solo add_header NON eredita quelli del server,
# e senza ripeterli qui sparirebbero proprio da index.html e dagli asset.

# Solo HTTPS per un anno. Niente includeSubDomains: gli altri sottodomini di
# spassocasa.it non sono di questa app e non li vincoliamo da qui.
add_header Strict-Transport-Security "max-age=31536000" always;
# Il browser non deve "indovinare" il tipo di un file (es. un upload come script).
add_header X-Content-Type-Options "nosniff" always;
# L'app non va mai incorniciata in un iframe altrui (clickjacking). frame-ancestors
# è la versione moderna, X-Frame-Options regge i browser vecchi.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# Verso altri siti parte solo l'origine, mai il path (che può contenere id).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Nessuna API del dispositivo serve all'app.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
