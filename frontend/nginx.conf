server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Asset con hash nel nome (es. index-ab12cd.js): contenuto immutabile,
    # si possono cachare "per sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html: NON deve mai essere cachato, altrimenti dopo un deploy i
    # dispositivi (soprattutto le webapp iOS in home) continuano a puntare ai
    # vecchi bundle JS rimossi -> schermata bianca.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # La webapp in home NON apre /index.html: il manifest dice start_url "/",
    # e quella richiesta viene servita dal blocco generico qui sotto tramite
    # `index` / `try_files`. Blocco esplicito perché l'URL da cui parte ogni
    # avvio dell'app riceva le stesse direttive di cache dell'HTML, senza
    # dipendere da quale location vince dopo il redirect interno.
    # `try_files /index.html` con un file (non ultimo parametro-URI) serve il
    # file da qui, quindi valgono questi header.
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
        try_files /index.html =404;
    }

    # Il manifest può cambiare: meglio rivalidarlo sempre.
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # API: tutto ciò che inizia per /api va al backend (servizio `backend` del
    # docker-compose, rete Docker interna). Il path passa così com'è: il BE
    # espone già le rotte sotto /api.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Senza questi, uvicorn --proxy-headers vedrebbe tutte le richieste come
        # provenienti dal container di nginx, e il rate limiting di /login
        # conterebbe l'intero traffico su un solo indirizzo.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Import di estratti conto e sync bancaria possono metterci un po'.
        proxy_read_timeout 120s;
        # L'estratto conto del connettore bancario (bank_connectors) passa da
        # qui: il default di 1 MB lo rifiuterebbe con un 413.
        client_max_body_size 20m;
    }

    # SPA fallback: ogni rotta non-file ricade su index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
