server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header di sicurezza: vedi security_headers.conf (va ripetuto nelle location
    # che hanno un loro add_header, che altrimenti non li erediterebbero).
    include /etc/nginx/snippets/security_headers.conf;

    # Asset con hash nel nome (es. index-ab12cd.js): contenuto immutabile,
    # si possono cachare "per sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security_headers.conf;
    }

    # index.html: NON deve mai essere cachato, altrimenti dopo un deploy i
    # dispositivi (soprattutto le webapp iOS in home) continuano a puntare ai
    # vecchi bundle JS rimossi -> schermata bianca.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
        expires -1;
    }

    # La webapp in home NON apre /index.html: il manifest dice start_url "/",
    # e quella richiesta viene servita dal blocco generico qui sotto tramite
    # `index` / `try_files`. Blocco esplicito perché l'URL da cui parte ogni
    # avvio dell'app riceva le stesse direttive di cache dell'HTML, senza
    # dipendere da quale location vince dopo il redirect interno.
    # `try_files /index.html` con un file (non ultimo parametro-URI) serve il
    # file da qui, quindi valgono questi header.
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security_headers.conf;
        expires -1;
        try_files /index.html =404;
    }

    # Il manifest può cambiare: meglio rivalidarlo sempre.
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security_headers.conf;
        expires -1;
    }

    # API: tutto ciò che inizia per /api va al backend (servizio
    # `spassoconti-backend` del docker-compose). Il path passa così com'è: il BE
    # espone già le rotte sotto /api. Il nome è univoco apposta: sulla rete
    # condivisa `coolify` un generico `backend` risolve anche ad altri progetti.
    location /api/ {
        # Il DNS interno di Docker, senza IPv6: sulla rete `coolify` il nome ha
        # anche un indirizzo IPv6, ma uvicorn ascolta solo su IPv4 e nginx
        # sbatteva su "connection refused" prima di ripiegare. Con il nome in una
        # variabile nginx lo risolve a runtime (valid=10s), quindi segue il
        # backend anche quando viene ricreato con un IP nuovo. Senza URI dopo la
        # variabile, il path della richiesta passa invariato.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend http://spassoconti-backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Senza questi, uvicorn --proxy-headers vedrebbe tutte le richieste come
        # provenienti dal container di nginx, e il rate limiting di /login
        # conterebbe l'intero traffico su un solo indirizzo.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Import di estratti conto e sync bancaria possono metterci un po'.
        proxy_read_timeout 120s;
        # L'estratto conto del connettore bancario (bank_connectors) passa da
        # qui: il default di 1 MB lo rifiuterebbe con un 413.
        client_max_body_size 20m;
    }

    # SPA fallback: ogni rotta non-file ricade su index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
