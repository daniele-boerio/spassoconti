# E2E del percorso che conta: login → nuovo movimento → saldo aggiornato.
#
# Gira backend + frontend veri, ma su un SQLite usa e getta
# (backend/scripts/e2e_server.py): niente produzione, niente Postgres da avviare.
# Playwright avvia entrambi i server da solo (frontend/playwright.config.ts).
name: E2E

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/e2e.yml"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dipendenze backend
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dipendenze frontend
        working-directory: frontend
        run: npm ci

      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Report (solo se fallisce)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
