# Monitor esterno di conti.spassocasa.it.
#
# Gira su GitHub, fuori casa: si accorge anche di quello che Coolify non può
# vedere (server spento, connessione di casa giù, Cloudflare/DNS rotti).
# /api/health interroga il database, quindi "verde" vuol dire app + BE + DB vivi.
#
# Avviso: un run fallito manda una mail di GitHub (Settings → Notifications →
# Actions: "Only notify for failed workflows"). Quattro tentativi a 30s di distanza
# prima di dichiarare il guasto: un deploy spegne i container per circa un minuto
# (lo stack compose non fa rolling update) e non deve far scattare l'allarme.
#
# NB: GitHub sospende i workflow programmati di un repo pubblico dopo 60 giorni
# senza commit; in quel caso arriva una mail e si riattiva da Actions → Uptime.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        run: |
          url="https://conti.spassocasa.it/api/health"
          expected='{"status":"ok","database":"ok"}'
          for attempt in 1 2 3 4; do
            body=$(curl -s --max-time 15 -w '\n%{http_code}' "$url" || true)
            code=$(echo "$body" | tail -n1)
            json=$(echo "$body" | head -n -1)
            if [ "$code" = "200" ] && [ "$json" = "$expected" ]; then
              echo "OK (tentativo $attempt): $json"
              exit 0
            fi
            echo "::warning::tentativo $attempt: HTTP $code — $json"
            [ "$attempt" -lt 4 ] && sleep 30
          done
          echo "::error::conti.spassocasa.it non risponde come dovrebbe (ultimo: HTTP $code — $json)"
          exit 1
